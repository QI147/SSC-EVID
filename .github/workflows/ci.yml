name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and harness tests (stub model, no key)
        run: python -m unittest discover -s tests -v
      - name: Reported numbers match the frozen tables
        run: python scripts/verify_reported_numbers.py
      - name: Manifests are internally consistent
        run: python scripts/preflight.py
